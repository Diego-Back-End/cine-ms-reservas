# Perfil de desarrollo local.
# Actívalo de cualquiera de estas formas:
#   mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#   java -jar target/ms-reservas-0.0.1-SNAPSHOT.jar --spring.profiles.active=dev
#   variable de entorno SPRING_PROFILES_ACTIVE=dev
#
# Con este perfil no se valida token (SecurityDevConfig permite todas las rutas)
# y UsuarioActual devuelve usuario-dev / dev@cinecloud.cl.
# spring.profiles.active=dev

# Base local para desarrollo
spring.datasource.url=jdbc:mysql://localhost:3306/db_reserva?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Sin issuer para no intentar levantar el decodificador de JWT en dev
spring.security.oauth2.resourceserver.jwt.issuer-uri=
