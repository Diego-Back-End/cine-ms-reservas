spring.application.name=ms-reserva

server.port=8082

# Datasource (sin credenciales reales; se leen de variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_reserva}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OAuth2 Resource Server (JWT). El issuer-uri se toma de la variable de entorno JWT_ISSUER_URI.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:}
