spring.application.name=ms-reserva

server.port=8082

# Datasource (sin credenciales reales; se leen SOLO de variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OAuth2 Resource Server (JWT de Amazon Cognito).
# COGNITO_ISSUER_URI ejemplo: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}
# Audience esperada: el ID token de Cognito trae aud = client id.
spring.security.oauth2.resourceserver.jwt.audiences=${COGNITO_CLIENT_ID}

# Origenes CORS permitidos, separados por comas.
app.cors.allowed-origins=${CORS_ORIGIN:}

# RabbitMQ (mismas variables de entorno que ms-notificaciones)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}

# Expiracion de reservas PENDIENTE (minutos) y intervalo de limpieza (ms)
#app.reserva.tiempo-expiracion-minutos=10
app.reserva.tiempo-expiracion-minutos=1
app.reserva.intervalo-limpieza-ms=60000
